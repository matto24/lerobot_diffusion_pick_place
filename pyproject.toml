[project]
name = "rob-vis-proj-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lerobot[dataset,dataset-viz,diffusion, training]>=0.7.0",
  "matplotlib>=3.10.7",
  "mujoco>=3.3.7",
  "numpy-quaternion>=2024.0.12",
  "ompl>=1.7.0",
  "open3d>=0.19.0",
  "pandas>=2.3.3",
  "roboticstoolbox-python>=1.1.1",
]


[tool.pyright]
stubPath = "typings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
