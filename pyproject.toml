[project]
name = "lerobot-diffusion-pick-place"
version = "0.1.0"
description = "Diffusion Policy pick-and-place on a simulated UR5e with LeRobot and MuJoCo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lerobot[dataset,dataset-viz,diffusion,training]>=0.7.0",
  "mujoco>=3.3.7",
  "ompl>=1.7.0",
  "roboticstoolbox-python>=1.1.1",
]


[tool.pyright]
stubPath = "typings"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
